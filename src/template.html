<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhi-Library</title>
  </head>
  <body>
    <div>
      <button id="open-button">Add Book</button>
    </div>

    <div id="form-overlay" class="hidden">
      <form id="book-form">
        <h2>Add New Book</h2>

        <label for="title">Title:</label>
        <input
          type="text"
          id="title"
          name="title"
          required
          placeholder="enter book title"
        />
        <span class="error-msg"></span>

        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required />

        <label for="pages">Pages:</label>
        <input type="number" id="pages" name="pages" min="1" required />

        <div class="form-checkbox">
          <label for="ifRead">Have you read it?</label>
          <input type="checkbox" id="ifRead" name="ifRead" />
        </div>

        <div class="form-buttons">
          <button type="button" class="close-btn">Close</button>
          <button type="submit" class="submit-btn">Add to Library</button>
        </div>
      </form>
    </div>

    <div id="content"></div>
  </body>
</html>
